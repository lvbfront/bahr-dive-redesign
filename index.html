<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Bahr — A deeper creative approach</title>
    <meta name="description" content="Bahr is an independent digital agency in Jeddah, Saudi Arabia. Web platforms, AI systems and mobile apps — made of depth." />
    <meta name="theme-color" content="#e6e6df" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bahr — The Dive" />
    <meta property="og:description" content="A homepage you dive into. Scroll from the surface to the seabed with Bahr, an independent digital agency in Jeddah." />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bahr — The Dive" />
    <meta name="twitter:description" content="A homepage you dive into — from the surface to the seabed." />
    <meta name="twitter:image" content="/og.png" />
    <link rel="preload" href="/fonts/syne-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/plex-latin-400.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      // Apply the persisted language before first paint (no flash of the wrong direction).
      try {
        if (localStorage.getItem('bahr-lang') === 'ar') {
          document.documentElement.lang = 'ar'
          document.documentElement.dir = 'rtl'
          ;['700', '400'].forEach(function (w) {
            var l = document.createElement('link')
            l.rel = 'preload'; l.as = 'font'; l.type = 'font/woff2'; l.crossOrigin = ''
            l.href = '/fonts/plex-arabic-' + w + '.woff2'
            document.head.appendChild(l)
          })
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <!-- Static first paint of the hero (replaced when React mounts) — keeps FCP/LCP fast. -->
      <div class="relative h-[100svh] overflow-hidden desk:min-h-[560px]" aria-hidden="true">
        <div class="water-fallback absolute inset-0"></div>
        <div class="relative z-10 flex h-full flex-col justify-between pt-28 pb-10 ps-[calc(var(--gutter)+var(--rail))] pe-[var(--gutter)] text-ink mob:pt-[calc(4.25rem+var(--safe-top))] mob:pb-[calc(1rem+var(--safe-bottom))]">
          <div class="flex flex-wrap items-start justify-between gap-4 text-sm">
            <p class="max-w-[22rem] font-medium"><span class="rtl:hidden">Independent digital agency — Jeddah, Saudi Arabia</span><span class="ltr:hidden">وكالة رقمية مستقلة — جدة، المملكة العربية السعودية</span></p>
          </div>
          <div>
            <p class="font-display font-bold text-[clamp(2.6rem,10.2vw,10rem)] leading-[0.92] tracking-[-0.035em] mob:text-[min(12.2vw,15.5svh)] rtl:hidden">
              <span class="block">A deeper</span><span class="block ps-[0.9em]">creative</span><span class="block">approach</span>
            </p>
            <p class="font-display font-bold text-[clamp(3.4rem,12vw,10.5rem)] leading-[1.15] mob:text-[min(16vw,17svh)] mob:leading-[1.22] ltr:hidden">
              <span class="block">عمق</span><span class="block ps-[0.9em]">إبداعي</span><span class="block">مختلف</span>
            </p>
          </div>
          <div class="h-9"></div>
        </div>
      </div>
    </div>
    <noscript>
      <p style="padding:2rem;font-family:sans-serif">Bahr — independent digital agency, Jeddah. <a href="mailto:dive@b7r.agency">dive@b7r.agency</a></p>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
